name: CI

# Gate on every PR into main. Production only ever deploys from main via the Vercel GitHub
# integration — there is no `vercel --prod` from a local machine. See CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      # Must point at a non-production database — generateStaticParams()/sitemap.ts read the
      # DB at build time. Add this as a repo secret (Settings → Secrets and variables → Actions)
      # pointing at the staging Neon branch (see docs/handover-cio.md); never point it at production.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  accessibility:
    runs-on: ubuntu-latest
    needs: build-and-lint
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: npm run start & npx --no-install wait-on http://localhost:3000 --timeout 30000
      - name: Run axe accessibility scan
        run: node scripts/a11y-scan.mjs
        env:
          BASE_URL: http://localhost:3000
